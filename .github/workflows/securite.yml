# Pipeline de sécurité et de qualité (TP2, étape 5) : s'exécute à chaque push et pull request.
# Les 6 premiers jobs contrôlent ; le job « deploiement » ne démarre que s'ils sont tous verts, sur la branche de
# déploiement ci (protégée), et seulement si api/ a changé (ou à la demande). Voir livrables/TP2_LIVRABLE.md, § 6.
name: Sécurité et tests

on:
  push:
  pull_request:
  workflow_dispatch:       # lancement à la main (onglet Actions) : force un déploiement

permissions:
  contents: read

jobs:
  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0            # tout l'historique : une clé retirée d'un fichier reste lisible dans les anciens commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code:
    name: Analyse statique du code (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll : échoue à partir de la sévérité moyenne. Les tests et le dossier model/ (poids) sont exclus.
      - run: bandit -r api -x api/tests,api/model -ll

  conformite:
    name: Conformité IA Act (model_card.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # Champs imposés par le TP2, catégorie de risque parmi les 4 niveaux du règlement, et aucune affirmation sans preuve
      # (par exemple « pas de biais » sans évaluation décrite).
      - run: python3 outils/verifier_model_card.py

  configuration:
    name: Configuration Docker et Kubernetes (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # Analyse le Dockerfile et les manifestes k8s de api/ (rien à analyser sur main : l'API locale n'en a pas).
      # Échoue à partir de la sévérité haute ; les risques acceptés sont listés avec leur raison dans .trivyignore.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: config
          scan-ref: api
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  image:
    name: Analyse de l'image Docker (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Chercher le Dockerfile de l'API
        id: presence
        run: |
          if [ -f api/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      # Construit l'image (sans poids : modèle factice, les paquets système et Python sont ceux de la vraie image) et
      # cherche les vulnérabilités connues avec correctif disponible. Les poids ne changent pas ce résultat.
      - name: Construire l'image
        if: steps.presence.outputs.present == 'true'
        run: |
          mkdir -p api/model            # les poids ne sont pas dans Git : dossier vide, modèle factice
          docker build -t dss-api:analyse api
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        if: steps.presence.outputs.present == 'true'
        with:
          scan-type: image
          image-ref: dss-api:analyse
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  tests-et-dependances:
    name: Tests de l'API et audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # Les tests et api/requirements-dev.txt appartiennent au code de l'API déployée (branches Enzo, cors, ci).
      # Sur main, api/ contient l'API locale de développement, sans tests : les étapes suivantes sont alors ignorées.
      - name: Chercher les tests de l'API
        id: presence
        run: |
          if [ -d api/tests ] && [ -f api/requirements-dev.txt ]; then echo "presents=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        if: steps.presence.outputs.presents == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Installer les dépendances de l'API (torch en version CPU)
        if: steps.presence.outputs.presents == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r api/requirements-dev.txt
      - name: Tests (clé, validation d'entrée, format de réponse, RGPD)
        if: steps.presence.outputs.presents == 'true'
        working-directory: api
        env:
          METRICS_PORT: "0"          # pas de serveur de métriques pendant les tests
        run: pytest -v
      - name: Audit des dépendances installées (vulnérabilités connues)
        if: steps.presence.outputs.presents == 'true'
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  deploiement:
    name: Déploiement sur GKE
    needs: [secrets, code, conformite, configuration, image, tests-et-dependances]
    # Jamais sur une pull request (le code vient peut-être d'un tiers) ; seulement sur la branche ci, protégée (pull request + contrôles obligatoires).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ci'
    runs-on: ubuntu-latest
    concurrency: deploiement        # un seul déploiement à la fois
    permissions:
      contents: read
      id-token: write               # jeton OIDC : GitHub prouve son identité à Google, aucune clé n'est stockée
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: api/ a-t-il changé ?
        id: changement
        run: |
          avant="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$avant" ] || [ "$avant" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$avant" 2>/dev/null || ! git diff --quiet "$avant" "${{ github.sha }}" -- api/; then
            echo "deployer=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rien à déployer : api/ n'a pas changé."
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093   # v3
        if: steps.changement.outputs.deployer == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db   # v3
        if: steps.changement.outputs.deployer == 'true'
        with:
          install_components: gke-gcloud-auth-plugin
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395   # v3
        if: steps.changement.outputs.deployer == 'true'
        with:
          cluster_name: dss-cluster
          location: europe-west9
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        if: steps.changement.outputs.deployer == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Récupérer les poids du modèle (bucket privé, hors de Git)
        if: steps.changement.outputs.deployer == 'true'
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r api/requirements-dev.txt
          mkdir -p models
          gcloud storage cp -r "${{ vars.GCP_MODEL_BUCKET }}/distilbert" models/
          gcloud storage cp "${{ vars.GCP_MODEL_BUCKET }}/seuils.json" models/seuils.json
          # Provenance : les poids doivent être EXACTEMENT ceux enregistrés dans api/model_empreintes.sha256 (relu en pull request).
          # Un fichier modifié ou ajouté dans le bucket (empoisonnement, porte dérobée) arrête le déploiement ici.
          (cd models && grep -v '^#' ../api/model_empreintes.sha256 | sha256sum --check --strict)
          # Aucun fichier de plus que la liste (sha256sum ne voit pas un fichier ajouté).
          diff <(cd models && find . -type f | sed 's|^\./||' | sort) <(grep -v '^#' api/model_empreintes.sha256 | awk '{print $2}' | sort)
          python api/export_model.py --type distilbert
          chmod a+r api/model/*       # le conteneur est non-root : il doit pouvoir lire les poids
      - name: Test du vrai modèle (avant de construire l'image)
        if: steps.changement.outputs.deployer == 'true'
        working-directory: api
        env:
          METRICS_PORT: "0"
        run: pytest -v tests/test_modele_reel.py
      - name: Noter la révision en service avant de déployer
        id: avant
        if: steps.changement.outputs.deployer == 'true'
        run: echo "revision=$(kubectl get deployment dss-api -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')" >> "$GITHUB_OUTPUT"
      - name: Construire l'image et déployer (le script contrôle l'API à la fin)
        if: steps.changement.outputs.deployer == 'true'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash api/deploy/deploy_gke.sh
      - name: Retour arrière automatique si le déploiement a échoué
        if: failure() && steps.changement.outputs.deployer == 'true'
        run: |
          # Seulement si un déploiement a réellement eu lieu : sinon « undo » ferait reculer une version saine.
          apres="$(kubectl get deployment dss-api -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"
          if [ "$apres" != "${{ steps.avant.outputs.revision }}" ]; then
            kubectl rollout undo deployment/dss-api
            kubectl rollout status deployment/dss-api --timeout=10m
          else
            echo "Aucun déploiement n'a eu lieu (révision $apres) : pas de retour arrière."
          fi
