# Déploiement de l'API : 2 copies (pods) minimum pour la redondance (failover).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss-api
  labels: {app: dss-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: dss-api}
  template:
    metadata:
      labels: {app: dss-api}
    spec:
      securityContext:
        runAsNonRoot: true                    # interdit l exécution en root
        runAsUser: 1000                       # numéro de appuser dans l image
      containers:
        - name: api
          image: IMAGE_URL                    # remplacé par deploy_gke.sh
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 9090                # métriques Prometheus (non exposé par le Service ni l'Ingress)
              name: metrics
          env:
            - name: PORT
              value: "8080"
            - name: ENV                       # prod -> ferme /docs, /redoc, /openapi.json
              value: "prod"
            - name: API_KEY                   # clé lue dans un Secret Kubernetes, jamais dans le code
              valueFrom:
                secretKeyRef: {name: dss-api-key, key: API_KEY}
          resources:                          # Autopilot facture ces ressources demandées
            requests: {cpu: "1", memory: 2Gi}   # DistilBERT : 66 M de paramètres (LAYA : 2 CPU, 4Gi)
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true      # un attaquant ne peut pas déposer d'exécutable dans le conteneur
            capabilities: {drop: ["ALL"]}
          volumeMounts:                       # seuls endroits où l'API peut écrire (fichiers temporaires, en mémoire)
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /home/appuser/.cache}
          startupProbe:                       # laisse le temps de charger spaCy + le modèle
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 60              # jusqu'à 5 min pour charger LAYA
          readinessProbe:                     # pas prêt -> retiré du load balancer
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          livenessProbe:                      # bloqué -> redémarré automatiquement
            httpGet: {path: /health, port: 8080}
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
        - {name: cache, emptyDir: {medium: Memory, sizeLimit: 64Mi}}